name: Release

# Any tag matching vMAJOR.MINOR.PATCH[-prerelease] builds and publishes
# three artifacts from a single source of truth (the tag): the container
# image (one tag, a manifest list of linux/amd64 and linux/arm64), its
# Cosign signature and provenance attestation, and the Helm chart. No
# secrets need to be configured: GHCR auth uses the default
# GITHUB_TOKEN, and Cosign signs keyless via GitHub's OIDC token
# (Fulcio/Rekor), so this also works unmodified once the repository
# moves to the `ferrobox` org.
#
# `workflow_dispatch` runs the same pipeline by hand from the Actions UI,
# with no git tag involved at all -- handy for debugging without having
# to create and delete throwaway tags for every iteration. Those runs
# are tagged with the triggering commit's short SHA (as a valid semver
# build, e.g. `0.0.0-sha-a1b2c3d`) instead of a real version number, so
# they can never collide with or overwrite an actual release such as
# `ghcr.io/.../ferrobox:0.1.0`, and the `release` job below is skipped
# for them entirely -- a debug run never creates a GitHub Release.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  prepare:
    name: Compute version and release metadata
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.vars.outputs.owner }}
      version: ${{ steps.vars.outputs.version }}
      image: ${{ steps.vars.outputs.image }}
      chart_repo: ${{ steps.vars.outputs.chart_repo }}
      is_release: ${{ steps.vars.outputs.is_release }}
      prerelease: ${{ steps.vars.outputs.prerelease }}
    steps:
      - name: Compute version, registry paths, and release flags
        id: vars
        run: |
          # ghcr.io scopes packages to the *current* repository owner, not
          # to a name we pick. Using github.repository_owner here (instead
          # of hardcoding `ferrobox`) means this workflow pushes to
          # ghcr.io/raulcmz/ferrobox today and to ghcr.io/ferrobox/ferrobox
          # once the repo is transferred -- no edit needed either way.
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"

          if [ "${{ github.event_name }}" = "push" ]; then
            # Real release: v0.1.0 -> 0.1.0 (matches infra/chart's
            # appVersion and infra/chart/values.yaml's default image.tag).
            version="${GITHUB_REF_NAME#v}"
            is_release=true
          else
            # Manual debug run, no tag: a valid-semver placeholder built
            # from the commit's short SHA, distinct from every real
            # version, so it can't be confused with (or overwrite) one.
            version="0.0.0-sha-${GITHUB_SHA:0:7}"
            is_release=false
          fi

          prerelease=false
          # v0.1.0-rc1 -> prerelease; v0.1.0 -> stable. (Debug versions
          # always contain a hyphen too, but that's moot: the release
          # job below only runs when is_release is true.)
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          {
            echo "owner=$owner"
            echo "version=$version"
            echo "image=ghcr.io/${owner}/ferrobox"
            echo "chart_repo=oci://ghcr.io/${owner}/charts"
            echo "is_release=$is_release"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  image:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # Push by digest only. The manifest job is what the tag points at.
      # provenance is off here so this digest is the image manifest, not
      # an extra attestation index. The manifest job attests the list.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          labels: |
            org.opencontainers.image.title=FerroBox
            org.opencontainers.image.description=Self-hosted artifact registry for Cargo, npm, PyPI, OCI images, Helm charts, Conan, Maven, NuGet, Go modules, and generic files.
            org.opencontainers.image.licenses=FSL-1.1-Apache-2.0
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        run: |
          set -euo pipefail
          digest="${{ steps.build.outputs.digest }}"
          hex="${digest#sha256:}"
          [[ "$hex" =~ ^[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/$hex"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.suffix }}
          path: ${{ runner.temp }}/digests/
          if-no-files-found: error

      - name: SBOM of this platform
        uses: anchore/sbom-action@v0.24.3
        with:
          image: ${{ needs.prepare.outputs.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: ferrobox-sbom-linux-${{ matrix.suffix }}.cdx.json
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          upload-artifact: false
          upload-release-assets: false

      - uses: actions/upload-artifact@v4
        with:
          name: ferrobox-sbom-${{ matrix.suffix }}
          path: ferrobox-sbom-linux-${{ matrix.suffix }}.cdx.json
          if-no-files-found: error

  manifest:
    name: Publish the manifest list
    needs: [prepare, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Create and push the manifest list
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          IS_RELEASE: ${{ needs.prepare.outputs.is_release }}
        run: |
          set -euo pipefail
          sources=()
          while IFS= read -r -d '' file; do
            hex="$(basename "$file")"
            [[ "$hex" =~ ^[0-9a-f]{64}$ ]] || continue
            sources+=("${IMAGE}@sha256:${hex}")
          done < <(find "$RUNNER_TEMP/digests" -type f -print0)
          [ "${#sources[@]}" -eq 2 ]
          tags=(--tag "${IMAGE}:${VERSION}")
          if [ "$IS_RELEASE" = "true" ]; then
            tags+=(--tag "${IMAGE}:latest")
          fi
          # Labels on each image config are set by the build. Annotations
          # on the index are a separate slot. Keep the text identical.
          # metadata-action would otherwise copy the GitHub About text and
          # report NOASSERTION for FSL-1.1-Apache-2.0.
          docker buildx imagetools create \
            "${tags[@]}" \
            --annotation "index:org.opencontainers.image.title=FerroBox" \
            --annotation "index:org.opencontainers.image.description=Self-hosted artifact registry for Cargo, npm, PyPI, OCI images, Helm charts, Conan, Maven, NuGet, Go modules, and generic files." \
            --annotation "index:org.opencontainers.image.licenses=FSL-1.1-Apache-2.0" \
            "${sources[@]}"

      - name: Read the signed index digest
        id: index
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          OWNER: ${{ needs.prepare.outputs.owner }}
        run: |
          set -euo pipefail
          token="$(curl -fsSL -u "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${OWNER}/ferrobox:pull" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
          digest="$(curl -fsSL -D - -o /dev/null \
            -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://ghcr.io/v2/${OWNER}/ferrobox/manifests/${VERSION}" \
            | awk 'tolower($1)=="docker-content-digest:" { gsub(/\r/,"",$2); print $2 }' \
            | tail -n 1)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Index digest ${digest}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the index (keyless)
        run: cosign sign --yes "${{ needs.prepare.outputs.image }}@${{ steps.index.outputs.digest }}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ needs.prepare.outputs.image }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

  chart:
    name: Package and push the Helm chart
    needs: [prepare, manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          # OCI chart registries need Helm >= 3.8.
          version: "v3.16.4"

      - name: Log in to GHCR (Helm OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Package the chart
        run: |
          helm package infra/chart \
            --version "${{ needs.prepare.outputs.version }}" \
            --app-version "${{ needs.prepare.outputs.version }}" \
            --destination .

      - name: Push the chart
        run: |
          helm push "ferrobox-${{ needs.prepare.outputs.version }}.tgz" \
            "${{ needs.prepare.outputs.chart_repo }}"

  release:
    name: Create the GitHub Release
    needs: [prepare, manifest, chart]
    if: needs.prepare.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: ferrobox-sbom-*
          path: dist
          merge-multiple: true

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: FerroBox v${{ needs.prepare.outputs.version }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/ferrobox-sbom-linux-amd64.cdx.json
            dist/ferrobox-sbom-linux-arm64.cdx.json
          body: |
            Image: `${{ needs.prepare.outputs.image }}@${{ needs.manifest.outputs.digest }}`, signed with [Cosign](https://github.com/sigstore/cosign) (keyless) and published with a [build provenance attestation](https://github.com/${{ github.repository }}/attestations).

            The digest is the manifest list (`linux/amd64` and `linux/arm64`). SBOM of each platform image: `ferrobox-sbom-linux-amd64.cdx.json` and `ferrobox-sbom-linux-arm64.cdx.json` (CycloneDX). Those files describe the FerroBox container, not a package stored in a repository.

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/v${{ needs.prepare.outputs.version }}/CHANGELOG.md) for what changed.
