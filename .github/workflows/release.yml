name: Release

# Builds and publishes a release of FerroBox: a signed, attested container
# image on GHCR and a Helm chart on the same registry (OCI), then a GitHub
# Release. Runs on every `vX.Y.Z` tag push. Can also be run by hand
# (workflow_dispatch) with an arbitrary version, without creating a tag or
# a release, to debug the pipeline itself.
#
# The image and chart are pushed under `ghcr.io/<repository_owner>/...`
# rather than a hardcoded `ferrobox` namespace, so this workflow keeps
# working unchanged before and after the repository moves to the
# `ferrobox` GitHub organization.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without a leading v (e.g. 0.1.0)"
        required: true
      create_release:
        description: "Also create a GitHub Release for this run"
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE_NAME: ferrobox
  CHART_PATH: infra/chart
  CHART_NAME: ferrobox

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
      owner: ${{ steps.vars.outputs.owner }}
      create_release: ${{ steps.vars.outputs.create_release }}
    steps:
      - name: Compute version, registry owner, and release flag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
            create_release=true
          else
            version="${{ inputs.version }}"
            create_release="${{ inputs.create_release }}"
          fi
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          {
            echo "version=$version"
            echo "owner=$owner"
            echo "create_release=$create_release"
          } >> "$GITHUB_OUTPUT"

  image:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      ref: ${{ steps.image_ref.outputs.ref }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image ref
        id: image_ref
        run: echo "ref=ghcr.io/${{ needs.prepare.outputs.owner }}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags and OCI labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image_ref.outputs.ref }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.create_release }}
          labels: |
            org.opencontainers.image.title=FerroBox
            org.opencontainers.image.description=Self-hosted artifact registry for Cargo, npm, PyPI, OCI, Helm, Conan, Maven, NuGet, and Go
            org.opencontainers.image.licenses=FSL-1.1-Apache-2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the image (keyless)
        run: cosign sign --yes "${{ steps.image_ref.outputs.ref }}@${{ steps.build.outputs.digest }}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.image_ref.outputs.ref }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  helm:
    needs: [prepare, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          # >= 3.8 is required for OCI support (`helm push`, `oci://`).
          version: "v3.16.4"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      - name: Package chart
        run: |
          helm package "${{ env.CHART_PATH }}" \
            --version "${{ needs.prepare.outputs.version }}" \
            --app-version "${{ needs.prepare.outputs.version }}" \
            --destination .

      - name: Push chart
        run: |
          helm push "${{ env.CHART_NAME }}-${{ needs.prepare.outputs.version }}.tgz" \
            "oci://ghcr.io/${{ needs.prepare.outputs.owner }}/charts"

  release:
    needs: [prepare, image, helm]
    if: needs.prepare.outputs.create_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: FerroBox v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for the full list of changes.

            - Container image: `ghcr.io/${{ needs.prepare.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}`
            - Helm chart: `oci://ghcr.io/${{ needs.prepare.outputs.owner }}/charts/${{ env.CHART_NAME }}` (`--version ${{ needs.prepare.outputs.version }}`)
