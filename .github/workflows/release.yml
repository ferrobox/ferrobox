name: Release

# Any tag matching vMAJOR.MINOR.PATCH[-prerelease] builds and publishes
# three artifacts from a single source of truth (the tag): the container
# image, its Cosign signature and provenance attestation, and the Helm
# chart. No secrets need to be configured: GHCR auth uses the default
# GITHUB_TOKEN, and Cosign signs keyless via GitHub's OIDC token
# (Fulcio/Rekor), so this also works unmodified once the repository
# moves to the `ferrobox` org.
#
# `workflow_dispatch` runs the same pipeline by hand from the Actions UI,
# with no git tag involved at all -- handy for debugging without having
# to create and delete throwaway tags for every iteration. Those runs
# are tagged with the triggering commit's short SHA (as a valid semver
# build, e.g. `0.0.0-sha-a1b2c3d`) instead of a real version number, so
# they can never collide with or overwrite an actual release such as
# `ghcr.io/.../ferrobox:0.1.0`, and the `release` job below is skipped
# for them entirely -- a debug run never creates a GitHub Release.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  prepare:
    name: Compute version and release metadata
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.vars.outputs.owner }}
      version: ${{ steps.vars.outputs.version }}
      image: ${{ steps.vars.outputs.image }}
      chart_repo: ${{ steps.vars.outputs.chart_repo }}
      is_release: ${{ steps.vars.outputs.is_release }}
      prerelease: ${{ steps.vars.outputs.prerelease }}
    steps:
      - name: Compute version, registry paths, and release flags
        id: vars
        run: |
          # ghcr.io scopes packages to the *current* repository owner, not
          # to a name we pick. Using github.repository_owner here (instead
          # of hardcoding `ferrobox`) means this workflow pushes to
          # ghcr.io/raulcmz/ferrobox today and to ghcr.io/ferrobox/ferrobox
          # once the repo is transferred -- no edit needed either way.
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"

          if [ "${{ github.event_name }}" = "push" ]; then
            # Real release: v0.1.0 -> 0.1.0 (matches infra/chart's
            # appVersion and infra/chart/values.yaml's default image.tag).
            version="${GITHUB_REF_NAME#v}"
            is_release=true
          else
            # Manual debug run, no tag: a valid-semver placeholder built
            # from the commit's short SHA, distinct from every real
            # version, so it can't be confused with (or overwrite) one.
            version="0.0.0-sha-${GITHUB_SHA:0:7}"
            is_release=false
          fi

          prerelease=false
          # v0.1.0-rc1 -> prerelease; v0.1.0 -> stable. (Debug versions
          # always contain a hyphen too, but that's moot: the release
          # job below only runs when is_release is true.)
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          {
            echo "owner=$owner"
            echo "version=$version"
            echo "image=ghcr.io/${owner}/ferrobox"
            echo "chart_repo=oci://ghcr.io/${owner}/charts"
            echo "is_release=$is_release"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  image:
    name: Build, sign, and attest the image
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags, labels, and OCI annotations
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.prepare.outputs.image }}
          # `latest` only follows a real release, never a debug run.
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.is_release }}
          # Labels land on the image config; annotations land on the OCI
          # manifest/index. They're separate metadata slots, so both need
          # to be set explicitly and kept identical -- otherwise
          # metadata-action falls back to the GitHub repo's "About"
          # description and detected license for annotations only, which
          # is stale (pre-rename copy) and can never detect a non-SPDX
          # license like FSL-1.1-Apache-2.0 (always reports NOASSERTION).
          labels: |
            org.opencontainers.image.title=FerroBox
            org.opencontainers.image.description=Self-hosted artifact registry for Cargo, npm, PyPI, OCI images, Helm charts, Conan, Maven, NuGet, Go modules, and generic files.
            org.opencontainers.image.licenses=FSL-1.1-Apache-2.0
          annotations: |
            org.opencontainers.image.title=FerroBox
            org.opencontainers.image.description=Self-hosted artifact registry for Cargo, npm, PyPI, OCI images, Helm charts, Conan, Maven, NuGet, Go modules, and generic files.
            org.opencontainers.image.licenses=FSL-1.1-Apache-2.0

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # linux/amd64 only for now: cross-compiling the Rust backend for
          # arm64 under QEMU is a lot slower and nobody has asked for it
          # yet. Add linux/arm64 here (and a cross toolchain in the
          # Dockerfile) when that changes.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the image (keyless)
        run: cosign sign --yes "${{ needs.prepare.outputs.image }}@${{ steps.build.outputs.digest }}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ needs.prepare.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  chart:
    name: Package and push the Helm chart
    needs: [prepare, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          # OCI chart registries need Helm >= 3.8.
          version: "v3.16.4"

      - name: Log in to GHCR (Helm OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Package the chart
        run: |
          helm package infra/chart \
            --version "${{ needs.prepare.outputs.version }}" \
            --app-version "${{ needs.prepare.outputs.version }}" \
            --destination .

      - name: Push the chart
        run: |
          helm push "ferrobox-${{ needs.prepare.outputs.version }}.tgz" \
            "${{ needs.prepare.outputs.chart_repo }}"

  release:
    name: Create the GitHub Release
    needs: [prepare, image, chart]
    if: needs.prepare.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: FerroBox v${{ needs.prepare.outputs.version }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          generate_release_notes: true
          body: |
            Image: `${{ needs.prepare.outputs.image }}@${{ needs.image.outputs.digest }}`, signed with [Cosign](https://github.com/sigstore/cosign) (keyless) and published with a [build provenance attestation](https://github.com/${{ github.repository }}/attestations).

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/v${{ needs.prepare.outputs.version }}/CHANGELOG.md) for what changed.
