name: OSV database

# Builds one gzipped ferrobox-osv-index from the public OSV exports and
# publishes it as a Cosign-signed OCI artifact. Installs pull
# ghcr.io/<owner>/osv-db:YYYY-MM-DD. That package is the only published
# copy. GitHub Releases of this repository stay FerroBox versions.
#
# An air-gapped install runs `oras pull` on that reference and checks
# ferrobox-osv-index.json.gz.sha256. The public key is osv-sync.pub.pem
# in this repository. Paste that file into the vulnerability-feed card.
#
# The signature is a Cosign key signature, not the keyless signature used
# for the FerroBox image. The consumer checks that key. Once, on a trusted
# machine:
#
#   cosign generate-key-pair
#
# Store the contents of cosign.key as the repository secret OSV_COSIGN_KEY
# and the password as OSV_COSIGN_PASSWORD. Do not commit the private key.
# Commit the matching public key as osv-sync.pub.pem. The workflow refuses
# to publish when the secret does not match that file.
on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: osv-db
  cancel-in-progress: false

jobs:
  publish:
    name: Build, sign, and publish the index
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Require the signing key
        env:
          OSV_COSIGN_KEY: ${{ secrets.OSV_COSIGN_KEY }}
        run: |
          if [ -z "$OSV_COSIGN_KEY" ]; then
            echo "Repository secret OSV_COSIGN_KEY is empty."
            echo "Generate a key with: cosign generate-key-pair"
            echo "Store cosign.key as OSV_COSIGN_KEY and the password as OSV_COSIGN_PASSWORD."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the index converter
        run: cargo build --release -p ferrobox-osv-index
        working-directory: backend

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Install oras
        run: |
          curl -fsSL -o /tmp/oras.tar.gz \
            https://github.com/oras-project/oras/releases/download/v1.2.2/oras_1.2.2_linux_amd64.tar.gz
          tar -xzf /tmp/oras.tar.gz -C /tmp oras
          sudo mv /tmp/oras /usr/local/bin/oras

      - name: Download the OSV exports
        run: |
          mkdir -p osv-zips
          for eco in npm PyPI crates.io Maven NuGet Go; do
            curl -fsSL --retry 3 --retry-delay 2 \
              -o "osv-zips/${eco}.zip" \
              "https://osv-vulnerabilities.storage.googleapis.com/${eco}/all.zip"
          done

      - name: Build the gzipped index
        id: index
        run: |
          date="$(date -u +%F)"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          backend/target/release/ferrobox-osv-index \
            --dataset "$date" \
            --output ferrobox-osv-index.json.gz \
            osv-zips/*.zip
          sha256sum ferrobox-osv-index.json.gz > ferrobox-osv-index.json.gz.sha256

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            oras login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push and sign the artifact
        env:
          OSV_COSIGN_KEY: ${{ secrets.OSV_COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.OSV_COSIGN_PASSWORD }}
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/osv-db"
          date="${{ steps.index.outputs.date }}"
          umask 077
          printf '%s\n' "$OSV_COSIGN_KEY" > cosign.key
          cosign public-key --key cosign.key > /tmp/osv-derived.pub.pem
          if ! cmp -s /tmp/osv-derived.pub.pem osv-sync.pub.pem; then
            echo "OSV_COSIGN_KEY does not match osv-sync.pub.pem in the repository."
            exit 1
          fi
          digest="$(awk '{print $1}' ferrobox-osv-index.json.gz.sha256)"
          oras push "${image}:${date}" \
            --artifact-type application/vnd.ferrobox.osv-index.v1 \
            --annotation "dev.ferrobox.osv.sha256=${digest}" \
            ferrobox-osv-index.json.gz:application/vnd.ferrobox.osv-index.v1 \
            ferrobox-osv-index.json.gz.sha256:text/plain
          cosign sign --yes --key cosign.key --tlog-upload=false "${image}:${date}"
          rm -f cosign.key
          {
            echo "owner=$owner"
            echo "image=$image"
          } >> "$GITHUB_ENV"
          {
            echo "## OSV database ${date}"
            echo
            echo "Artifact: \`${image}:${date}\`"
            echo
            echo "Air-gap: \`oras pull ${image}:${date}\` then \`sha256sum -c ferrobox-osv-index.json.gz.sha256\`."
            echo
            echo "Public key: \`osv-sync.pub.pem\` in this repository."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Make the package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A public repository publishes a public container. GITHUB_TOKEN
          # often gets HTTP 404 from the visibility API even then.
          package_public() {
            local visibility
            visibility="$(gh api "/orgs/${owner}/packages/container/osv-db" --jq .visibility 2>/dev/null || true)"
            if [ "$visibility" = "public" ]; then
              return 0
            fi
            visibility="$(gh api "/user/packages/container/osv-db" --jq .visibility 2>/dev/null || true)"
            [ "$visibility" = "public" ]
          }
          if package_public; then
            echo "osv-db is public"
            exit 0
          fi
          gh api --method PATCH "/orgs/${owner}/packages/container/osv-db" -f visibility=public \
            || gh api --method PATCH "/user/packages/container/osv-db" -f visibility=public \
            || true
          if package_public; then
            echo "osv-db is public"
            exit 0
          fi
          token="$(curl -fsS "https://ghcr.io/token?service=ghcr.io&scope=repository:${owner}/osv-db:pull" | jq -r .token)"
          code="$(
            curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.oci.image.manifest.v1+json" \
              "https://ghcr.io/v2/${owner}/osv-db/manifests/${{ steps.index.outputs.date }}"
          )"
          if [ "$code" = "200" ]; then
            echo "Anonymous pull of ${image}:${{ steps.index.outputs.date }} returned HTTP 200"
            exit 0
          fi
          echo "Anonymous pull returned HTTP ${code}. The package is not public."
          exit 1

      - name: Remove database releases from the product page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # These tags used to be GitHub Releases, so the daily index became
          # Latest and sat beside the FerroBox versions. The index is only
          # the OCI artifact now.
          tags="$(gh release list --limit 200 --json tagName --jq '.[].tagName')"
          for tag in $tags; do
            case "$tag" in
              osv-db-*)
                gh release delete "$tag" --yes --cleanup-tag
                ;;
            esac
          done
