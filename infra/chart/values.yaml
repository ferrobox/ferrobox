# Image built from the repo-root Dockerfile (`ferrobox:local` in compose).
image:
  repository: ferrobox
  tag: local
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

replicaCount: 1

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ferrobox.local
  tls: []

# Public URL (no trailing slash). Use it on the Ingress or with port-forward.
publicBaseUrl: http://127.0.0.1:3000

admin:
  username: admin
  # Empty: generated and reused across upgrades.
  password: ""

# Federated login. Empty issuer and clientId = disabled.
oidc:
  issuer: ""
  clientId: ""
  clientSecret: ""
  redirectUri: ""
  successRedirect: ""
  scopes: ""
  adminRoles: ""
  developerRoles: ""
  readerRoles: ""
  roleClaim: ""
  groupClaim: ""
  autoCreateGroups: true

# Chart Postgres (same as compose). If you turn it off, set externalUrl.
postgresql:
  enabled: true
  image: postgres:18-alpine
  username: ferrobox
  password: ""
  database: ferrobox
  persistence:
    size: 8Gi
    storageClass: ""
  # Full DATABASE_URL when enabled=false
  externalUrl: ""

# Single-node Garage (same as compose). If you turn it off, fill s3.external.
garage:
  enabled: true
  image: dxflrs/garage:v2.2.0
  # 64 hex chars (openssl rand -hex 32). Empty: generated.
  rpcSecret: ""
  adminToken: ""
  metricsToken: ""
  persistence:
    metaSize: 1Gi
    dataSize: 8Gi
    storageClass: ""

s3:
  region: garage
  bucket: ferrobox
  accessKeyId: ""
  secretAccessKey: ""
  # Required when garage.enabled=false
  externalEndpointUrl: ""

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
