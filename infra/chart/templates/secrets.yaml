{{- $appName := include "ferrobox.appSecretName" . -}}
{{- $garageName := include "ferrobox.garageSecretName" . -}}
{{- $existingApp := lookup "v1" "Secret" .Release.Namespace $appName -}}
{{- $existingGarage := lookup "v1" "Secret" .Release.Namespace $garageName -}}
{{- $prevAdmin := "" -}}
{{- $prevPg := "" -}}
{{- $prevAccess := "" -}}
{{- $prevSecret := "" -}}
{{- $prevRpc := "" -}}
{{- $prevAdminTok := "" -}}
{{- $prevMetrics := "" -}}
{{- if and $existingApp $existingApp.data -}}
{{- $prevAdmin = index $existingApp.data "ADMIN_PASSWORD" | default "" | b64dec -}}
{{- $prevPg = index $existingApp.data "POSTGRES_PASSWORD" | default "" | b64dec -}}
{{- $prevAccess = index $existingApp.data "S3_ACCESS_KEY_ID" | default "" | b64dec -}}
{{- $prevSecret = index $existingApp.data "S3_SECRET_ACCESS_KEY" | default "" | b64dec -}}
{{- end -}}
{{- if and $existingGarage $existingGarage.data -}}
{{- $prevRpc = index $existingGarage.data "GARAGE_RPC_SECRET" | default "" | b64dec -}}
{{- $prevAdminTok = index $existingGarage.data "GARAGE_ADMIN_TOKEN" | default "" | b64dec -}}
{{- $prevMetrics = index $existingGarage.data "GARAGE_METRICS_TOKEN" | default "" | b64dec -}}
{{- end -}}
{{- $adminPassword := .Values.admin.password | default $prevAdmin | default (randAlphaNum 24) -}}
{{- $pgPassword := .Values.postgresql.password | default $prevPg | default (randAlphaNum 24) -}}
{{- $s3Access := .Values.s3.accessKeyId | default $prevAccess | default (printf "GK%s" (randAlphaNum 12)) -}}
{{- $s3Secret := .Values.s3.secretAccessKey | default $prevSecret | default (sha256sum (randAlphaNum 32) | nospace) -}}
{{- $rpcSecret := .Values.garage.rpcSecret | default $prevRpc | default (sha256sum (randAlphaNum 64) | nospace) -}}
{{- $adminToken := .Values.garage.adminToken | default $prevAdminTok | default (randAlphaNum 32) -}}
{{- $metricsToken := .Values.garage.metricsToken | default $prevMetrics | default (randAlphaNum 32) -}}
{{- $pgUser := .Values.postgresql.username -}}
{{- $pgDb := .Values.postgresql.database -}}
{{- $databaseUrl := .Values.postgresql.externalUrl -}}
{{- if .Values.postgresql.enabled -}}
{{- $databaseUrl = printf "postgres://%s:%s@%s:5432/%s" $pgUser $pgPassword (include "ferrobox.postgresName" .) $pgDb -}}
{{- end -}}
{{- if not $databaseUrl -}}
{{- fail "postgresql.externalUrl is required when postgresql.enabled is false" -}}
{{- end -}}
{{- $s3Endpoint := .Values.s3.externalEndpointUrl -}}
{{- if .Values.garage.enabled -}}
{{- $s3Endpoint = printf "http://%s:3900" (include "ferrobox.garageName" .) -}}
{{- end -}}
{{- if not $s3Endpoint -}}
{{- fail "s3.externalEndpointUrl is required when garage.enabled is false" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $appName }}
  labels:
    {{- include "ferrobox.labels" . | nindent 4 }}
type: Opaque
stringData:
  ADMIN_USERNAME: {{ .Values.admin.username | quote }}
  ADMIN_PASSWORD: {{ $adminPassword | quote }}
  POSTGRES_USER: {{ $pgUser | quote }}
  POSTGRES_PASSWORD: {{ $pgPassword | quote }}
  POSTGRES_DB: {{ $pgDb | quote }}
  DATABASE_URL: {{ $databaseUrl | quote }}
  S3_ENDPOINT_URL: {{ $s3Endpoint | quote }}
  S3_REGION: {{ .Values.s3.region | quote }}
  S3_ACCESS_KEY_ID: {{ $s3Access | quote }}
  S3_SECRET_ACCESS_KEY: {{ $s3Secret | quote }}
  S3_BUCKET: {{ .Values.s3.bucket | quote }}
  PUBLIC_BASE_URL: {{ .Values.publicBaseUrl | quote }}
{{- if .Values.garage.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $garageName }}
  labels:
    {{- include "ferrobox.labels" . | nindent 4 }}
    app.kubernetes.io/component: garage
type: Opaque
stringData:
  GARAGE_RPC_SECRET: {{ $rpcSecret | quote }}
  GARAGE_ADMIN_TOKEN: {{ $adminToken | quote }}
  GARAGE_METRICS_TOKEN: {{ $metricsToken | quote }}
  S3_ACCESS_KEY_ID: {{ $s3Access | quote }}
  S3_SECRET_ACCESS_KEY: {{ $s3Secret | quote }}
  S3_BUCKET: {{ .Values.s3.bucket | quote }}
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "sqlite"

    replication_factor = 1

    rpc_bind_addr = "[::]:3901"
    rpc_public_addr = "127.0.0.1:3901"
    rpc_secret = "{{ $rpcSecret }}"

    [s3_api]
    s3_region = "{{ .Values.s3.region }}"
    api_bind_addr = "[::]:3900"
    root_domain = ".s3.garage.localhost"

    [s3_web]
    bind_addr = "[::]:3902"
    root_domain = ".web.garage.localhost"

    [admin]
    api_bind_addr = "[::]:3903"
    admin_token = "{{ $adminToken }}"
    metrics_token = "{{ $metricsToken }}"
{{- end }}
