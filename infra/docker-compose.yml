name: ferrobox
services:
  postgres:
    image: postgres:18-alpine
    container_name: ferrobox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  garage-config:
    image: alpine:3.21
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_METRICS_TOKEN: ${GARAGE_METRICS_TOKEN}
      GARAGE_RPC_PUBLIC_ADDR: ${GARAGE_RPC_PUBLIC_ADDR:-garage:3901}
    volumes:
      - ./garage/garage.toml.template:/template:ro
      - garage_etc:/config
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache gettext >/dev/null
        envsubst < /template > /config/garage.toml

  garage:
    image: dxflrs/garage:v2.2.0
    container_name: ferrobox-garage
    restart: unless-stopped
    depends_on:
      garage-config:
        condition: service_completed_successfully
    ports:
      - "3900:3900"
    volumes:
      - garage_etc:/config:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    # dxflrs/garage is FROM scratch with no ENTRYPOINT; command replaces CMD.
    command: ["/garage", "-c", "/config/garage.toml", "server"]
    healthcheck:
      test: ["CMD", "/garage", "-c", "/config/garage.toml", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  garage-init:
    # The Garage image has no shell. Bootstrap through the admin API instead.
    image: alpine:3.21
    depends_on:
      garage:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-ferrobox}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_ADMIN_URL: http://garage:3903
    volumes:
      - ./garage/bootstrap.sh:/bootstrap.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    restart: "no"

  ferrobox:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ferrobox:local
    container_name: ferrobox
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    ports:
      - "${FERROBOX_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT_URL: http://garage:3900
      S3_REGION: ${S3_REGION:-garage}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-ferrobox}
      BIND_ADDRESS: 0.0.0.0:3000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:3000}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      FRONTEND_DIR: /app/www
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_SUCCESS_REDIRECT: ${OIDC_SUCCESS_REDIRECT:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-}
      OIDC_ADMIN_ROLES: ${OIDC_ADMIN_ROLES:-}
      OIDC_DEVELOPER_ROLES: ${OIDC_DEVELOPER_ROLES:-}
      OIDC_READER_ROLES: ${OIDC_READER_ROLES:-}
      OIDC_ROLE_CLAIM: ${OIDC_ROLE_CLAIM:-}
      OIDC_GROUP_CLAIM: ${OIDC_GROUP_CLAIM:-}
      OIDC_AUTO_CREATE_GROUPS: ${OIDC_AUTO_CREATE_GROUPS:-true}
      OSV_SYNC_REF: ${OSV_SYNC_REF:-}
      OSV_SYNC_KEY: ${OSV_SYNC_KEY:-}
      OSV_SYNC_PUBKEY_B64: ${OSV_SYNC_PUBKEY_B64:-}
      OSV_SYNC_TOKEN: ${OSV_SYNC_TOKEN:-}
      OSV_SYNC_INTERVAL_HOURS: ${OSV_SYNC_INTERVAL_HOURS:-24}

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: ferrobox-keycloak
    profiles: ["sso"]
    command:
      - start-dev
      - --import-realm
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: 127.0.0.1
      KC_HOSTNAME_PORT: "8080"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak/ferrobox-realm.json:/opt/keycloak/data/import/ferrobox-realm.json:ro

volumes:
  postgres_data:
  garage_etc:
  garage_meta:
  garage_data:
