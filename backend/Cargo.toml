[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/ports",
    "crates/application",
    "crates/adapters/s3-storage",
    "crates/adapters/postgres",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
uuid = { version = "1", features = ["v7"] }
thiserror = "2"
url = "2"
async-trait = "0.1"
bytes = "1"
tokio = { version = "1", features = ["macros", "rt"] }
aws-sdk-s3 = { version = "1", features = ["behavior-version-latest"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "json", "macros"] }
